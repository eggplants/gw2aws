[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "uv-dynamic-versioning" ]

[project]
name = "gw2aws"
description = "SAML login to AWS via Google Workspace using Playwright"
readme = "README.md"
keywords = [
  "aws",
  "cli",
  "google-workspace",
  "mfa",
  "playwright",
  "saml",
  "single-sign-on",
  "sso",
  "sts",
]
license = { text = "MIT" }
authors = [ { name = "eggplants" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: System :: Systems Administration :: Authentication/Directory",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "boto3>=1.28",
  "install-playwright>=0.1",
  "playwright>=1.40",
  "pyotp>=2.9",
]
urls.Documentation = "https://egpl.dev/gw2aws/"
urls.Issues = "https://github.com/eggplants/gw2aws/issues"
urls.Repository = "https://github.com/eggplants/gw2aws"
scripts.gw2aws = "gw2aws.cli:main"

[dependency-groups]
dev = [
  "pymarkdownlnt>=0.9.33",
  "pyproject-fmt>=2.11.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7",
]
docs = [
  "pdoc>=16",
]

[tool.hatch]
version.source = "uv-dynamic-versioning"
build.targets.wheel.packages = [ "gw2aws" ]
build.targets.sdist.packages = [ "gw2aws" ]

[tool.uv]
python-downloads = "never"
default-groups = [
  "dev",
  "docs",
]
exclude-newer = "P7D"
preview = true

[tool.ruff]
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812",
  "CPY001", # Missing copyright notice (this project does not use file headers)
  "D",
]
lint.per-file-ignores."gw2aws/aws.py" = [
  "ICN001", # `xml.etree.ElementTree` is spelled out for its two calls
  "S314",   # the parsed XML is the assertion the IdP just issued to this browser session
]
lint.per-file-ignores."gw2aws/browser.py" = [
  "PLR0913", # Too many arguments (they are keyword-only login knobs)
  "RUF001",  # Ambiguous unicode character (Google types the apostrophe as U+2019)
  "S311",    # Standard pseudo-random generator (the waits pace the typing, nothing is secured by them)
  "T201",    # `print` found (progress messages go to stderr)
]
lint.per-file-ignores."gw2aws/cli.py" = [
  "T201", # `print` found
]
lint.per-file-ignores."main.py" = [
  "T201", # `print` found
]
lint.per-file-ignores."packaging/entrypoint.py" = [
  "INP001", # Implicit namespace package (frozen entry point, not importable content)
]
lint.per-file-ignores."tests/**" = [
  "ANN",     # Missing type annotations (tests/fixtures)
  "ARG",     # Unused arguments (pytest fixtures, lambda stubs)
  "CPY001",  # Missing copyright notice
  "FBT",     # Boolean positional arguments (fake constructors mirror the real signatures)
  "INP001",  # Implicit namespace package (no __init__ in tests)
  "PLR2004", # Magic value used in comparison
  "RUF001",  # Ambiguous unicode character (the fixtures quote Google copy with U+2019)
  "S101",    # Use of assert detected
  "S105",    # Possible hardcoded password (test fixtures)
  "S106",    # Possible hardcoded password argument (test fixtures)
  "S108",    # Probable insecure use of temp dir (test fixtures)
  "SLF001",  # Private member accessed (tests exercise internals)
  "UP017",   # datetime.timezone.utc vs datetime.UTC
]
lint.pydocstyle.convention = "google"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
fallback-version = "0.0.0"
